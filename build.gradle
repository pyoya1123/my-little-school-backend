plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    querydslVersion = '5.0.0' // QueryDSL 버전 설정
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-web-services'

    // Standard Commons Logging discovery in action with spring-jcl: please remove commons-logging.jar
    // from classpath in order to avoid potential conflicts
    // 에러 제거
    configurations.all {
        exclude group: 'commons-logging', module: 'commons-logging'
    }


    // AWS
    implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.459'

    // QueryDSL
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // MapStruct
//    implementation 'org.mapstruct:mapstruct:1.5.3.Final'
//    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.3.Final'

    // MySQL
    runtimeOnly 'mysql:mysql-connector-java:8.0.32'

    // OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Spring Boot Actuator (프로파일링 및 모니터링)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Micrometer Prometheus (메트릭 수집)
    implementation 'io.micrometer:micrometer-registry-prometheus'
    
    // AOP (성능 측정용)
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    
    // Faker (목업 데이터 생성용)
    implementation('com.github.javafaker:javafaker:1.0.2') {
        exclude group: 'org.yaml', module: 'snakeyaml'
    }
    
    // snakeyaml 버전 명시적 지정 (Spring Boot가 관리하는 버전 사용)
    implementation 'org.yaml:snakeyaml'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // JSON Simple
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    // JAXB 의존성 추가
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.1'

    // dotenv-java 라이브러리
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // Spring Security (비밀번호 암호화용)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // YAML 처리 (snakeyaml 버전 충돌 해결)
    // Spring Boot 3.3.4와 호환되는 버전 사용
    implementation 'org.yaml:snakeyaml'

    // Spring WebSocket 의존성
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // WebSocket 서버를 위한 Spring Boot Starter
    implementation 'org.springframework.boot:spring-boot-starter'

    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'

    // Cloudinary Java SDK
    implementation 'com.cloudinary:cloudinary-core:1.29.0'
    implementation 'com.cloudinary:cloudinary-http44:1.29.0' // HTTP 어댑터 추가

    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

}

sourceSets {
    main {
        java {
            srcDirs += "src/main/generated"
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

clean {
    delete file('src/main/generated')
}

tasks.withType(JavaCompile) {
    options.generatedSourceOutputDirectory = file('src/main/generated')
}
